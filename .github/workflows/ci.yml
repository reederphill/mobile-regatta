name: CI

# The merge gate, kept fast: every package builds and its unit tests pass (scripts/test.sh, the bot suites left to
# nightly), and the app and its test targets compile. Everything slow or behaviour-pinned (the golden on the Linux
# replay platform, the bot suites, the app's unit tests on the simulator, Postgres, the online end-to-end run) is
# nightly.yml's: it never blocks a merge.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packages:
    name: Packages build and unit tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build/check
          key: test-v1-${{ runner.os }}-${{ hashFiles('Packages/*/Package.resolved') }}
          restore-keys: test-v1-${{ runner.os }}-
      - run: scripts/test.sh

  app:
    name: App compiles
    # Pinned so the SDK only changes on purpose: Xcode 26.6.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Acknowledgements list is up to date
        run: swift scripts/generate-acknowledgements.swift --check
      - name: xcodebuild build-for-testing (the app and its test targets)
        run: |
          xcodebuild build-for-testing -project Regatta.xcodeproj -scheme Regatta \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData -quiet
