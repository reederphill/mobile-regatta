name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# A new push supersedes the run in progress for the same branch or pull request.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Jobs a change can't reach are skipped, which counts as passing for a required check.
  changes:
    name: What the change reaches
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      core: ${{ steps.filter.outputs.core }}
      protocol: ${{ steps.filter.outputs.protocol }}
      client: ${{ steps.filter.outputs.client }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ci: &ci
              - ".github/workflows/ci.yml"
              - "scripts/**"
            core:
              - *ci
              - "Packages/RegattaCore/**"
            protocol:
              - *ci
              - "Packages/RegattaCore/**"
              - "Packages/RegattaProtocol/**"
            client:
              - *ci
              - "Packages/**"
            app:
              - *ci
              - "Regatta/**"
              - "RegattaTests/**"
              - "RegattaUITests/**"
              - "Regatta.xcodeproj/**"
              - "ThirdParty/**"
              - "Packages/RegattaCore/Sources/**"
              - "Packages/RegattaCore/Package.*"

  linux:
    name: Golden and builds on the pinned Linux replay platform
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LINUX_SCRATCH: ${{ github.workspace }}/.linux-scratch
      LINUX_TEST_TIMEOUT_MINUTES: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .linux-scratch
          key: linux-scratch-${{ hashFiles('scripts/linux-test.sh', 'Packages/*/Package.resolved') }}
          restore-keys: linux-scratch-
      - name: Golden and RegattaBots replay digests (debug and release); every package builds
        shell: bash  # explicit, so the step runs with pipefail and a failure isn't hidden by tee
        run: scripts/linux-test.sh 2>&1 | tee linux-test.log
      - name: Golden digest
        if: always()
        run: |
          grep -o 'GOLDEN simulationVersion=.*' linux-test.log | sort -u | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Let the cache read the container's build
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .linux-scratch || true

  macos:
    name: Packages on macOS
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build/check
          key: check-${{ runner.os }}-${{ hashFiles('Packages/*/Package.resolved') }}
          restore-keys: check-${{ runner.os }}-
      - name: Build, then test, the packages the change reaches (scripts/check.sh)
        run: |
          packages=""
          [[ "${{ needs.changes.outputs.core }}" == true ]] && packages+=" RegattaCore"
          [[ "${{ needs.changes.outputs.protocol }}" == true ]] && packages+=" RegattaProtocol"
          packages+=" RegattaClient RegattaServer"
          scripts/check.sh --force --no-app --packages "$packages"
      - name: Same digest across two test processes
        if: needs.changes.outputs.core == 'true'
        timeout-minutes: 10
        run: scripts/check-digest-stable.sh

  app:
    name: App tests on the iOS Simulator
    needs: changes
    if: needs.changes.outputs.app == 'true'
    # Pinned so the SDK and simulator runtime only change on purpose: Xcode 26.6, iOS 26.5.
    runs-on: macos-26
    # Room for a retried UI test: the practice-race finish test alone takes about 2.5 min per device.
    timeout-minutes: 45
    env:
      # DEVELOPER_DIR rather than xcode-select: switching with xcode-select hid the simulators.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # Reaches the test runner as CI: render fixture references are never recorded here (#62).
      TEST_RUNNER_CI: "true"
      TEST_RUNNER_GITHUB_ACTIONS: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Acknowledgements list is up to date
        run: swift scripts/generate-acknowledgements.swift --check
      # A failed test runs once more (-retry-tests-on-failure -test-iterations 2): the simulator now and
      # then fails to launch or terminate the app between UI tests. A test that fails twice fails the job.
      - name: xcodebuild test (unit + UI)
        run: |
          xcodebuild test -project Regatta.xcodeproj -scheme Regatta \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            -retry-tests-on-failure -test-iterations 2 \
            -derivedDataPath DerivedData -resultBundlePath Regatta.xcresult
      - name: xcodebuild test (UI) on iPad, for the letterboxed race view (G5)
        run: |
          xcodebuild test -project Regatta.xcodeproj -scheme Regatta \
            -destination 'platform=iOS Simulator,name=iPad Air 13-inch (M4),OS=26.5' \
            -only-testing:RegattaUITests -retry-tests-on-failure -test-iterations 2 \
            -derivedDataPath DerivedData -resultBundlePath Regatta-iPad.xcresult
      - name: Upload the result bundles (screenshots, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Regatta.xcresult
          path: |
            Regatta.xcresult
            Regatta-iPad.xcresult
          if-no-files-found: ignore
