name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Nightly, with every job reaching everything (see `changes`): the iPad run and the rest that a pull request skips.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# A new push supersedes the run in progress for the same pull request. On main every commit's run completes:
# the group is the commit, so the "Log #N completed" commit that follows a merge can't cancel the merge's run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Jobs a change can't reach are skipped, which counts as passing for a required check.
  changes:
    name: What the change reaches
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # A scheduled or manual run has no change to filter: it reaches everything.
    outputs:
      core: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.core }}
      protocol: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.protocol }}
      client: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.client }}
      server: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.server }}
      app: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.app }}
      viewport: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.viewport }}
      imagediff: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.imagediff }}
      online: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.online }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          filters: |
            ci: &ci
              - ".github/workflows/ci.yml"
              - "scripts/**"
            core:
              - *ci
              - "Packages/RegattaCore/**"
            protocol:
              - *ci
              - "Packages/RegattaCore/**"
              - "Packages/RegattaProtocol/**"
            client:
              - *ci
              - "Packages/**"
            server:
              - *ci
              - "Packages/**"
              - "Dockerfile"
              - ".dockerignore"
            app:
              - *ci
              - "Regatta/**"
              - "RegattaTests/**"
              - "RegattaUITests/**"
              - "Regatta.xcodeproj/**"
              - "ThirdParty/**"
              - "Packages/RegattaCore/Sources/**"
              - "Packages/RegattaCore/Package.*"
              # The app races online with RegattaClient over RegattaProtocol (#68).
              - "Packages/RegattaProtocol/Sources/**"
              - "Packages/RegattaProtocol/Package.*"
              - "Packages/RegattaClient/Sources/**"
              - "Packages/RegattaClient/Package.*"
              # The app's online services (#242).
              - "Packages/RegattaServices/Sources/**"
              - "Packages/RegattaServices/Package.*"
            # The image-diff tool's own self-tests (RenderFixtureUITests' testMovedBoat…, …IdenticallyTwice,
            # …OnePixel…) run only for these.
            imagediff:
              - *ci
              - "RegattaUITests/ImageDiff.swift"
              - "RegattaUITests/ReferencePolicy.swift"
              - "RegattaUITests/RenderFixtureTestCase.swift"
              - "RegattaUITests/RenderFixtureUITests.swift"
            # Online code: the end-to-end run needs a macOS slot, so it runs only for these.
            online:
              - *ci
              - "Packages/RegattaClient/**"
              - "Packages/RegattaProtocol/**"
              - "Packages/RegattaServer/**"
              - "Regatta/Online*"
              - "Regatta/Online*/**"
              - "RegattaUITests/OnlineRaceUITests.swift"
            # What shapes the race view in the window (G5): the iPad's letterbox test runs only for these.
            viewport:
              - *ci
              - "Regatta/Game/RaceViewportPolicy.swift"
              - "Regatta/UI/RaceView.swift"
              - "Regatta/UI/HUDView.swift"
              - "Regatta/App/**"
              - "Regatta/Info.plist"
              - "Regatta.xcodeproj/**"
              - "RegattaUITests/RaceViewportUITests.swift"
              - "RegattaUITests/RaceUITestCase.swift"

  linux:
    name: Golden and builds on the pinned Linux replay platform
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LINUX_SCRATCH: ${{ github.workspace }}/.linux-scratch
      LINUX_TEST_TIMEOUT_MINUTES: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .linux-scratch
          key: linux-scratch-${{ hashFiles('scripts/linux-test.sh', 'Packages/*/Package.resolved') }}
          restore-keys: linux-scratch-
      - name: Golden and RegattaBots replay digests (debug and release); every package builds
        shell: bash  # explicit, so the step runs with pipefail and a failure isn't hidden by tee
        run: scripts/linux-test.sh 2>&1 | tee linux-test.log
      - name: Golden digest
        if: always()
        run: |
          grep -o 'GOLDEN simulationVersion=.*' linux-test.log | sort -u | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Let the cache read the container's build
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .linux-scratch || true

  container:
    name: Server image; load clients sail a race in the Linux container
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (Dockerfile)
        run: docker build --platform linux/amd64 -t regatta-server .
      - name: The server refuses to start without ENV=dev
        run: |
          set +e
          docker run --rm regatta-server
          status=$?
          set -e
          echo "exit status $status"
          test "$status" -eq 78
      - name: One client, then 16 in one race, within the bandwidth budget (#67, #27)
        run: |
          docker run -d --name regatta -e ENV=dev -p 8080:8080 regatta-server
          for i in $(seq 1 30); do curl --silent --fail localhost:8080/health && break; sleep 1; done
          curl --silent --show-error --fail localhost:8080/health
          echo
          docker exec regatta regatta-loadclient --clients 1 --race-seconds 5 --start-seconds 2
          docker exec regatta regatta-loadclient --clients 16 --race-seconds 20 --start-seconds 5 --check-bandwidth \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Server log
        if: always()
        run: docker logs regatta || true

  # The server's Postgres stores (#144, ADR 0009) against a real Postgres: a service container next to the pinned
  # Linux replay image (scripts/check-image-pins.sh holds the two pins equal). macOS's check.sh skips these tests,
  # having no database; here REGATTA_REQUIRE_DATABASE=1 makes a missing REGATTA_TEST_DATABASE_URL a failure, not a
  # skip (CI=true alone doesn't: GitHub sets it on every runner, the macOS job included).
  persistence:
    name: Server persistence against Postgres
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: swift:6.3.3-noble@sha256:8de8ea332a61e961ead4ef41029c2552b18e1a70dd5942d25ecf7d8de2eec5b5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: regatta
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REGATTA_REQUIRE_DATABASE: "1"
      REGATTA_TEST_DATABASE_URL: postgres://postgres:regatta@postgres:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build/persistence
          key: persistence-${{ hashFiles('scripts/linux-test.sh', 'Packages/RegattaServer/Package.resolved') }}
          restore-keys: persistence-
      - name: Migrations, the race registry and the data-file store (swift test --filter PersistenceTests)
        run: swift test --package-path Packages/RegattaServer --scratch-path .build/persistence --filter PersistenceTests

  macos:
    name: Packages on macOS
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build/check
          # v2: one scratch directory per package, built at -O (scripts/check.sh).
          key: check-v2-${{ runner.os }}-${{ hashFiles('Packages/*/Package.resolved') }}
          restore-keys: check-v2-${{ runner.os }}-
      - name: Build, then test, the packages the change reaches (scripts/check.sh)
        run: |
          packages=""
          [[ "${{ needs.changes.outputs.core }}" == true ]] && packages+=" RegattaCore"
          [[ "${{ needs.changes.outputs.protocol }}" == true ]] && packages+=" RegattaProtocol"
          packages+=" RegattaClient RegattaServices RegattaServer"
          scripts/check.sh --force --no-app --packages "$packages"
      - name: Same digest across two test processes
        if: needs.changes.outputs.core == 'true'
        timeout-minutes: 10
        run: scripts/check-digest-stable.sh

  app:
    name: App tests on the iOS Simulator
    needs: changes
    if: needs.changes.outputs.app == 'true'
    # Pinned so the SDK and simulator runtime only change on purpose: Xcode 26.6, iOS 26.5.
    runs-on: macos-26
    # Everything but the render references (the `render` job, below): the unit tests and the UI tests, plus the iPad
    # run on main. About 10 min, 15 with the iPad: a cold boot of each simulator is 2-4 min of it. The rest is room
    # for the two fast-timescale race tests (iPhone only) to hang on both tries, 2 × 2 × the 5 min allowance below =
    # 20 min, and one more launch that fails at the allowance: 15 + 20 + 5 = 40. History: by 2026-10-01 the render
    # fixtures (1-3 min each) had brought a green run to 39 min, and once the practice, results, My boat, help and
    # briefing UI tests were added, main runs hit the 60 min limit. The render fixtures now run in their own job,
    # so the 60 min here is room, not need.
    timeout-minutes: 60
    env:
      # DEVELOPER_DIR rather than xcode-select: switching with xcode-select hid the simulators.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # Reaches the test runner as CI: render fixture references are never recorded here (#62).
      TEST_RUNNER_CI: "true"
      TEST_RUNNER_GITHUB_ACTIONS: "true"
      # Reaches the test runner as REFERENCE_ACTUALS_DIR: a reference test whose compare fails, or that has no
      # reference, leaves its render there as <device>/<name>.png (and its diff as <name>-diff.png), uploaded
      # by the `render` job as render-actuals for scripts/adopt-references.sh (#215); nothing here uploads it.
      TEST_RUNNER_REFERENCE_ACTUALS_DIR: ${{ github.workspace }}/render-actuals
    # No simulator boots in the background: while one boots, everything else that reaches CoreSimulator crawls
    # (actool's thinned asset catalog went from 7 s to 4-10 min, the acknowledgements check from 25 s to 5 min),
    # which cost more than the boot saved. Each device boots when its tests start.
    steps:
      - uses: actions/checkout@v4
      - name: Acknowledgements list is up to date
        run: swift scripts/generate-acknowledgements.swift --check
      # Built once; both devices run the same products. (The `render` job builds its own: jobs don't share a runner.)
      - name: xcodebuild build-for-testing
        run: |
          xcodebuild build-for-testing -project Regatta.xcodeproj -scheme Regatta \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' -derivedDataPath DerivedData
      # Unit + UI runs a failed test once more (-retry-tests-on-failure -test-iterations 2): the
      # simulator now and then fails to launch or terminate the app between UI tests. A test that fails twice
      # fails the job. Each test gets 5 min, so a hung test fails itself rather than running the job out of time. The
      # allowance is a ceiling on the whole test, so no test's own waits add up to more than 3.5 min
      # (RaceUITestCase); the slowest passing test takes about 2 on the iOS 27 image.
      - name: xcodebuild test (unit + UI, without the render fixtures) on iPhone
        run: |
          xcodebuild test-without-building -project Regatta.xcodeproj -scheme Regatta \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            -skip-testing:RegattaUITests/RenderFixtureUITests \
            -retry-tests-on-failure -test-iterations 2 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 300 \
            -derivedDataPath DerivedData -resultBundlePath Regatta.xcresult
      # Only the letterboxed race view (G5) differs on iPad; the other UI tests don't depend on the device. It
      # runs on main (a push) and nightly, never on a pull request, and only when the change reaches the view's
      # shape (the viewport filter; a nightly run reaches everything). The iPhone shuts down first, so the iPad
      # boots on a runner with its memory back.
      - name: xcodebuild test (UI) on iPad, for the letterboxed race view (G5)
        if: github.event_name != 'pull_request' && needs.changes.outputs.viewport == 'true'
        run: |
          xcrun simctl shutdown all || true
          xcodebuild test-without-building -project Regatta.xcodeproj -scheme Regatta \
            -destination 'platform=iOS Simulator,name=iPad Air 13-inch (M4),OS=26.5' \
            -only-testing:RegattaUITests/RaceViewportUITests -retry-tests-on-failure -test-iterations 2 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 300 \
            -derivedDataPath DerivedData -resultBundlePath Regatta-iPad.xcresult
      - name: Upload the result bundles (screenshots, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Regatta.xcresult
          path: |
            Regatta.xcresult
            Regatta-iPad.xcresult
          if-no-files-found: ignore

  # The render fixtures (RenderFixtureUITests: HUD, leaderboard, fleet, charts, 1-3 min each), split out of `app` so
  # that neither job runs out of time, and a moved render fails at once with its render uploaded as render-actuals.
  render:
    name: Render references on the iOS Simulator
    needs: changes
    if: needs.changes.outputs.app == 'true'
    # Pinned so the SDK and simulator runtime only change on purpose: Xcode 26.6, iOS 26.5.
    runs-on: macos-26
    # About 10 min to build and boot, the render step about 18 min (#127 added the thermal-tier cue test, ~5 min), no
    # retry: 50 min is room for a hung fixture (5 min allowance each) and a slow boot, not the expected run. The
    # image-diff self-tests add a few minutes, and only when a change reaches the tool.
    timeout-minutes: 50
    env:
      # DEVELOPER_DIR rather than xcode-select: switching with xcode-select hid the simulators.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # Reaches the test runner as CI: render fixture references are never recorded here (#62).
      TEST_RUNNER_CI: "true"
      TEST_RUNNER_GITHUB_ACTIONS: "true"
      # Reaches the test runner as REFERENCE_ACTUALS_DIR: a reference test whose compare fails, or that has no
      # reference, leaves its render there as <device>/<name>.png (and its diff as <name>-diff.png), uploaded
      # below as render-actuals for scripts/adopt-references.sh (#215).
      TEST_RUNNER_REFERENCE_ACTUALS_DIR: ${{ github.workspace }}/render-actuals
    # No simulator boots in the background: while one boots, everything else that reaches CoreSimulator crawls
    # (actool's thinned asset catalog went from 7 s to 4-10 min, the acknowledgements check from 25 s to 5 min),
    # which cost more than the boot saved. Each device boots when its tests start.
    steps:
      - uses: actions/checkout@v4
      - name: xcodebuild build-for-testing
        run: |
          xcodebuild build-for-testing -project Regatta.xcodeproj -scheme Regatta \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' -derivedDataPath DerivedData
      # The render references first, as their own step, with no retry: a render that moved fails the job at
      # about 13 min, not 31, and its render is in render-actuals for scripts/adopt-references.sh. The
      # image-diff tool's self-tests are skipped here (their own step, below).
      # The simulator boots here, in the foreground, before the tests: a first boot posts system notifications (a
      # "Ready for Apple Intelligence" banner covered the top ~300 px of briefing-steady in run 37231353556) that
      # land over whichever render is on screen. `bootstatus -b` returns once the boot's first-run work is done.
      # A banner that still comes is dismissed by RenderFixtureTestCase (dismissSystemBanner), which looks for one
      # in SpringBoard before and after a render's screenshots. The compare is untouched.
      - name: Boot the iPhone and wait for its first boot to finish
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          for runtime, devices in json.load(sys.stdin)['devices'].items():
              if 'iOS-26-5' in runtime:
                  for d in devices:
                      if d['name'] == 'iPhone 17':
                          print(d['udid'])
                          sys.exit(0)
          sys.exit(1)")
          xcrun simctl bootstatus "$device" -b
      - name: xcodebuild test (render references) on iPhone
        run: |
          xcodebuild test-without-building -project Regatta.xcodeproj -scheme Regatta \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            -only-testing:RegattaUITests/RenderFixtureUITests \
            -skip-testing:RegattaUITests/RenderFixtureUITests/testFixtureRendersIdenticallyTwice \
            -skip-testing:RegattaUITests/RenderFixtureUITests/testOnePixelChangeOnARealRenderPasses \
            -skip-testing:RegattaUITests/RenderFixtureUITests/testMovedBoatFailsWithTheDiffAttached \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 300 \
            -derivedDataPath DerivedData -resultBundlePath Regatta-render.xcresult
      # The image-diff tool's own tests, only when a change reaches the tool (the imagediff filter).
      - name: xcodebuild test (image-diff self-tests) on iPhone
        if: needs.changes.outputs.imagediff == 'true'
        run: |
          xcodebuild test-without-building -project Regatta.xcodeproj -scheme Regatta \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            -only-testing:RegattaUITests/RenderFixtureUITests/testFixtureRendersIdenticallyTwice \
            -only-testing:RegattaUITests/RenderFixtureUITests/testOnePixelChangeOnARealRenderPasses \
            -only-testing:RegattaUITests/RenderFixtureUITests/testMovedBoatFailsWithTheDiffAttached \
            -retry-tests-on-failure -test-iterations 2 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 300 \
            -derivedDataPath DerivedData -resultBundlePath Regatta-imagediff.xcresult
      - name: Upload the result bundles (screenshots, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Regatta-render.xcresult
          path: |
            Regatta-render.xcresult
            Regatta-imagediff.xcresult
          if-no-files-found: ignore
      # A failed reference compare's render: `scripts/adopt-references.sh <PR>` copies it into
      # the references folder, so a reference change never needs a local simulator run (#215).
      # Also on a cancelled job: a run that times out (many reference tests failing twice) still leaves its renders.
      - name: Upload the renders that failed their reference compare (render-actuals)
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: render-actuals
          path: render-actuals
          if-no-files-found: ignore
          retention-days: 5

  # The online client against a real server (#68): the app's UI test above skips its online race without one.
  e2e:
    name: Online race end to end (app on the iOS Simulator, local RegattaServer)
    needs: changes
    if: needs.changes.outputs.online == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      TEST_RUNNER_CI: "true"
      TEST_RUNNER_GITHUB_ACTIONS: "true"
      E2E_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.5
    steps:
      - uses: actions/checkout@v4
      - name: scripts/e2e.sh (a dev instant race with bots, raced to its close)
        run: |
          scripts/e2e.sh -retry-tests-on-failure -test-iterations 2 \
            -derivedDataPath DerivedData -resultBundlePath E2E.xcresult
      - name: Upload the result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E2E.xcresult
          path: E2E.xcresult
          if-no-files-found: ignore
