name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# A new push supersedes the run in progress for the same branch or pull request.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Jobs a change can't reach are skipped, which counts as passing for a required check.
  changes:
    name: What the change reaches
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      core: ${{ steps.filter.outputs.core }}
      protocol: ${{ steps.filter.outputs.protocol }}
      client: ${{ steps.filter.outputs.client }}
      server: ${{ steps.filter.outputs.server }}
      app: ${{ steps.filter.outputs.app }}
      viewport: ${{ steps.filter.outputs.viewport }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ci: &ci
              - ".github/workflows/ci.yml"
              - "scripts/**"
            core:
              - *ci
              - "Packages/RegattaCore/**"
            protocol:
              - *ci
              - "Packages/RegattaCore/**"
              - "Packages/RegattaProtocol/**"
            client:
              - *ci
              - "Packages/**"
            server:
              - *ci
              - "Packages/**"
              - "Dockerfile"
              - ".dockerignore"
            app:
              - *ci
              - "Regatta/**"
              - "RegattaTests/**"
              - "RegattaUITests/**"
              - "Regatta.xcodeproj/**"
              - "ThirdParty/**"
              - "Packages/RegattaCore/Sources/**"
              - "Packages/RegattaCore/Package.*"
              # The app races online with RegattaClient over RegattaProtocol (#68).
              - "Packages/RegattaProtocol/Sources/**"
              - "Packages/RegattaProtocol/Package.*"
              - "Packages/RegattaClient/Sources/**"
              - "Packages/RegattaClient/Package.*"
            # What shapes the race view in the window (G5): the iPad's letterbox test runs only for these.
            viewport:
              - *ci
              - "Regatta/Game/RaceViewportPolicy.swift"
              - "Regatta/UI/RaceView.swift"
              - "Regatta/UI/HUDView.swift"
              - "Regatta/App/**"
              - "Regatta/Info.plist"
              - "Regatta.xcodeproj/**"
              - "RegattaUITests/RaceViewportUITests.swift"
              - "RegattaUITests/RaceUITestCase.swift"

  linux:
    name: Golden and builds on the pinned Linux replay platform
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LINUX_SCRATCH: ${{ github.workspace }}/.linux-scratch
      LINUX_TEST_TIMEOUT_MINUTES: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .linux-scratch
          key: linux-scratch-${{ hashFiles('scripts/linux-test.sh', 'Packages/*/Package.resolved') }}
          restore-keys: linux-scratch-
      - name: Golden and RegattaBots replay digests (debug and release); every package builds
        shell: bash  # explicit, so the step runs with pipefail and a failure isn't hidden by tee
        run: scripts/linux-test.sh 2>&1 | tee linux-test.log
      - name: Golden digest
        if: always()
        run: |
          grep -o 'GOLDEN simulationVersion=.*' linux-test.log | sort -u | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Let the cache read the container's build
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .linux-scratch || true

  container:
    name: Server image; load clients sail a race in the Linux container
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (Dockerfile)
        run: docker build --platform linux/amd64 -t regatta-server .
      - name: The server refuses to start without ENV=dev
        run: |
          set +e
          docker run --rm regatta-server
          status=$?
          set -e
          echo "exit status $status"
          test "$status" -eq 78
      - name: One client, then 16 in one race, within the bandwidth budget (#67, #27)
        run: |
          docker run -d --name regatta -e ENV=dev -p 8080:8080 regatta-server
          for i in $(seq 1 30); do curl --silent --fail localhost:8080/health && break; sleep 1; done
          curl --silent --show-error --fail localhost:8080/health
          echo
          docker exec regatta regatta-loadclient --clients 1 --race-seconds 5 --start-seconds 2
          docker exec regatta regatta-loadclient --clients 16 --race-seconds 20 --start-seconds 5 --check-bandwidth \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Server log
        if: always()
        run: docker logs regatta || true

  macos:
    name: Packages on macOS
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build/check
          key: check-${{ runner.os }}-${{ hashFiles('Packages/*/Package.resolved') }}
          restore-keys: check-${{ runner.os }}-
      - name: Build, then test, the packages the change reaches (scripts/check.sh)
        run: |
          packages=""
          [[ "${{ needs.changes.outputs.core }}" == true ]] && packages+=" RegattaCore"
          [[ "${{ needs.changes.outputs.protocol }}" == true ]] && packages+=" RegattaProtocol"
          packages+=" RegattaClient RegattaServer"
          scripts/check.sh --force --no-app --packages "$packages"
      - name: Same digest across two test processes
        if: needs.changes.outputs.core == 'true'
        timeout-minutes: 10
        run: scripts/check-digest-stable.sh

  app:
    name: App tests on the iOS Simulator
    needs: changes
    if: needs.changes.outputs.app == 'true'
    # Pinned so the SDK and simulator runtime only change on purpose: Xcode 26.6, iOS 26.5.
    runs-on: macos-26
    # About 10 min, 15 with the iPad: a cold boot of each simulator is 2-4 min of it. Room for retried UI tests.
    timeout-minutes: 30
    env:
      # DEVELOPER_DIR rather than xcode-select: switching with xcode-select hid the simulators.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # Reaches the test runner as CI: render fixture references are never recorded here (#62).
      TEST_RUNNER_CI: "true"
      TEST_RUNNER_GITHUB_ACTIONS: "true"
    # No simulator boots in the background: while one boots, everything else that reaches CoreSimulator crawls
    # (actool's thinned asset catalog went from 7 s to 4-10 min, the acknowledgements check from 25 s to 5 min),
    # which cost more than the boot saved. Each device boots when its tests start.
    steps:
      - uses: actions/checkout@v4
      - name: Acknowledgements list is up to date
        run: swift scripts/generate-acknowledgements.swift --check
      # Built once; both devices run the same products.
      - name: xcodebuild build-for-testing
        run: |
          xcodebuild build-for-testing -project Regatta.xcodeproj -scheme Regatta \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' -derivedDataPath DerivedData
      # A failed test runs once more (-retry-tests-on-failure -test-iterations 2): the simulator now and
      # then fails to launch or terminate the app between UI tests. A test that fails twice fails the job.
      - name: xcodebuild test (unit + UI) on iPhone
        run: |
          xcodebuild test-without-building -project Regatta.xcodeproj -scheme Regatta \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            -retry-tests-on-failure -test-iterations 2 \
            -derivedDataPath DerivedData -resultBundlePath Regatta.xcresult
      # Only the letterboxed race view (G5) differs on iPad; the other UI tests don't depend on the device. It
      # runs when a change reaches the view's shape (the viewport filter), and in the iOS 27 workflow's iPad run.
      # The iPhone shuts down first, so the iPad boots on a runner with its memory back.
      - name: xcodebuild test (UI) on iPad, for the letterboxed race view (G5)
        if: needs.changes.outputs.viewport == 'true'
        run: |
          xcrun simctl shutdown all || true
          xcodebuild test-without-building -project Regatta.xcodeproj -scheme Regatta \
            -destination 'platform=iOS Simulator,name=iPad Air 13-inch (M4),OS=26.5' \
            -only-testing:RegattaUITests/RaceViewportUITests -retry-tests-on-failure -test-iterations 2 \
            -derivedDataPath DerivedData -resultBundlePath Regatta-iPad.xcresult
      - name: Upload the result bundles (screenshots, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Regatta.xcresult
          path: |
            Regatta.xcresult
            Regatta-iPad.xcresult
          if-no-files-found: ignore

  # The online client against a real server (#68): the app's UI test above skips its online race without one.
  e2e:
    name: Online race end to end (app on the iOS Simulator, local RegattaServer)
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.server == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      TEST_RUNNER_CI: "true"
      TEST_RUNNER_GITHUB_ACTIONS: "true"
      E2E_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.5
    steps:
      - uses: actions/checkout@v4
      - name: scripts/e2e.sh (a dev instant race with bots, raced to its close)
        run: |
          scripts/e2e.sh -retry-tests-on-failure -test-iterations 2 \
            -derivedDataPath DerivedData -resultBundlePath E2E.xcresult
      - name: Upload the result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E2E.xcresult
          path: E2E.xcresult
          if-no-files-found: ignore
