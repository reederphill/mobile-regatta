name: iOS 27 SDK

# The app built with the iOS 27 SDK (#107). It runs on GitHub's Xcode 27 image, which is slow and bills macOS
# minutes, so it doesn't run on every push: only when shipping-relevant files change (on a pull request or on
# main), weekly, and by hand. Its runs hold one of the account's few macOS runners for 30-45 min, so a run on
# every merge and every orchestration-log commit left CI's macOS jobs queued behind it.
on:
  push:
    branches: [ "main" ]
    paths: &shipping
      - "Regatta/Info.plist"
      - "Regatta.xcodeproj/**"
      - "**/*.entitlements"
      - "**/PrivacyInfo.xcprivacy"
      - "Regatta/App/**"
      - "**/RaceViewportPolicy.swift"
      - "scripts/check-shipping-config.sh"
      - ".github/workflows/ios27.yml"
  pull_request:
    branches: [ "main" ]
    paths: *shipping
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

# A new push supersedes the run in progress for the same branch or pull request.
concurrency:
  group: ios27-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App on the iOS 27 SDK (shipping config)
    # GitHub's Xcode 27 image (preview; macOS 27, arm64). Apps built with the iOS 27 SDK need the scene life
    # cycle and a launch screen, and UIRequiresFullScreen is ignored (#107).
    runs-on: xcode-27
    # A green run is 42-45 min: about 25 to the first test, then about 10 per device. The rest is room for a
    # test that hangs on both tries on both devices (4 × the 5 min allowance below) and a retried launch.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios
          xcrun simctl list runtimes | grep -i ios
      - name: Archive for device, unsigned (signing is done by a person)
        run: |
          xcodebuild archive -project Regatta.xcodeproj -scheme Regatta \
            -destination 'generic/platform=iOS' -archivePath Regatta.xcarchive CODE_SIGNING_ALLOWED=NO
      - name: Archived Info.plist and privacy manifest
        run: scripts/check-shipping-config.sh Regatta.xcarchive/Products/Applications/Regatta.app iphoneos27
      - name: Boot the iOS 27 simulators
        # Booted up front: the first boot on this image is slow enough to time out UI test launches.
        run: |
          xcrun simctl bootstatus 'iPhone 17' -b
          xcrun simctl bootstatus 'iPad Air 13-inch (M4)' -b
      - name: Launch on the iOS 27 simulator
        run: |
          xcodebuild build -project Regatta.xcodeproj -scheme Regatta \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.0' -derivedDataPath DerivedData
          app=DerivedData/Build/Products/Debug-iphonesimulator/Regatta.app
          scripts/check-shipping-config.sh "$app" iphonesimulator27
          xcrun simctl install 'iPhone 17' "$app"
          xcrun simctl launch 'iPhone 17' com.phillreeder.regatta
          sleep 15
          xcrun simctl io 'iPhone 17' screenshot launch-ios27.png
          xcrun simctl spawn 'iPhone 17' launchctl list | grep 'com.phillreeder.regatta' \
            || { echo "Regatta isn't running 15 s after launch" >&2; exit 1; }
          echo "Regatta is running on iOS 27."
      # Each test gets 5 min (the slowest passing one, a render fixture, takes about 2), so a hang fails that
      # test instead of the job: a UI test's element read once blocked for 21 min and the job ran out of time
      # before the iPad started. A failed test runs once more, as in ci.yml: the simulator now and then fails
      # to launch the app ("Failed to get background assertion"). A test that fails twice fails the job.
      - name: xcodebuild test (unit + UI) on iOS 27, iPhone and iPad
        run: |
          xcodebuild test -project Regatta.xcodeproj -scheme Regatta \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.0' \
            -destination 'platform=iOS Simulator,name=iPad Air 13-inch (M4),OS=27.0' \
            -disable-concurrent-destination-testing \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 300 \
            -retry-tests-on-failure -test-iterations 2 \
            -derivedDataPath DerivedData -resultBundlePath Regatta-ios27.xcresult
      - name: Test failures
        if: failure()
        run: xcrun xcresulttool get test-results summary --path Regatta-ios27.xcresult || true
      - name: Upload the result bundle and launch screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Regatta-ios27
          path: |
            Regatta-ios27.xcresult
            launch-ios27.png
          if-no-files-found: ignore
